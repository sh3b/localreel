name: localreel

# One image, different commands. Settings come from .env (copy .env.example);
# the ones with a default can be left out.
x-app: &app
  build: .
  restart: unless-stopped
  # The app runs as PID 1, which never reaps processes it didn't start, such
  # as the ffmpeg a killed download leaves; an init process does.
  init: true
  # Match the owner of bind-mounted *_PATH dirs. Not on db/nginx: they drop
  # privileges themselves.
  user: "${PUID:-1000}:${PGID:-1000}"
  environment:
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: ${DB_USER:?set DB_USER in .env}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (copy .env.example)}
    DB_NAME: ${DB_NAME:?set DB_NAME in .env}
    # Absolute, matching the mounts below; relative would depend on WORKDIR.
    DOWNLOADS_DIR: /app/data/downloads
    MEDIA_DIR: /app/data/media
    DOWNLOAD_POLL_INTERVAL_SEC: ${DOWNLOAD_POLL_INTERVAL_SEC:?set DOWNLOAD_POLL_INTERVAL_SEC in .env}
    TRANSCODE_POLL_INTERVAL_SEC: ${TRANSCODE_POLL_INTERVAL_SEC:?set TRANSCODE_POLL_INTERVAL_SEC in .env}
    DOWNLOAD_TIMEOUT_SEC: ${DOWNLOAD_TIMEOUT_SEC:?set DOWNLOAD_TIMEOUT_SEC in .env}
    TRANSCODE_TIMEOUT_SEC: ${TRANSCODE_TIMEOUT_SEC:?set TRANSCODE_TIMEOUT_SEC in .env}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18-alpine
    container_name: localreel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    command: -c log_statement=${DB_LOG_STATEMENT:-none}
    volumes:
      # Named by default (a network share is unsafe for Postgres); without a
      # name the image's VOLUME gets an anonymous one that `down` orphans and
      # `up` replaces with an empty one — a silently wiped library.
      # Postgres 18 declares /var/lib/postgresql, not the /data subdir.
      - ${PGDATA_PATH:-pgdata}:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    <<: *app
    # One-shot: must stay exited, or dependents never see it complete.
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    healthcheck:
      # -f: a 503 (database down) counts as a failure.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  download-worker:
    <<: *app
    command: python -m localreel.entrypoints.download_worker.main
    volumes:
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/app/data/downloads

  transcode-worker:
    <<: *app
    command: python -m localreel.entrypoints.transcode_worker.main
    volumes:
      # Reads the mezzanine and archived thumbnail, writes the derived tree.
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/app/data/downloads
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/app/data/media

  nginx:
    # nginx with the built web UI and nginx.conf baked in.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/app/data/media:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Through the proxy, so it covers nginx and the api behind it.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
