server {
    listen 80;

    # The built web UI (frontend/), copied into the image by frontend/Dockerfile.
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /media/ {
        alias /app/data/media/;
        sendfile on;
        tcp_nopush on;
    }

    # The trailing slash strips /api, so FastAPI keeps its own paths (/videos).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build output with a content hash in the name never changes, so browsers
    # can keep it; index.html is not cached so a new build shows up at once.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any other path gets index.html and the UI routes it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
