# Cache-Control per path. Chosen here rather than with add_header inside each
# location, because an add_header in a location drops every add_header of the
# server block, security headers included. An empty value sends no header.
map $uri $cache_control {
    # Build output with a content hash in the name never changes, so browsers
    # can keep it.
    ~^/_app/immutable/ "public, max-age=31536000, immutable";
    # The API and the media decide for themselves.
    ~^/api/            "";
    ~^/media/          "";
    # index.html and the rest are checked every time, so a new build shows up at once.
    default            "no-cache";
}

# Look the api up by name through Docker's DNS, again whenever it changes: a
# recreated api container gets a new IP, and an address resolved once at start
# would leave every /api/ request failing with 502 until nginx restarts.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api {
    zone api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_tokens off;

    # The built web UI (frontend/), copied into the image by frontend/Dockerfile.
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control;
    # The CSP itself is a <meta> tag in index.html (frontend/vite.config.ts);
    # framing can only be refused by a header.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /media/ {
        alias /app/data/media/;
        sendfile on;
        tcp_nopush on;
    }

    # The trailing slash strips /api, so FastAPI keeps its own paths (/videos).
    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any other path gets index.html and the UI routes it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
