# Runs as the container's user, not root: a port above 1024, pid and temp
# files in /tmp.
pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    access_log off;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server {
        listen 8080;
        root /app/ui;

        # The CSP is a <meta> tag (vite.config.ts); these only work as headers.
        # Caching uses expires: an add_header in a location would drop these.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location /media/ {
            alias /app/data/downloads/;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
        }

        location /_app/immutable/ {
            expires 1y;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
